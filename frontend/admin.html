<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>InventoryIQ — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <div class="wrap">

    <header>
      <div>
        <h1>Admin</h1>
        <div class="sub">User accounts &amp; access</div>
      </div>
      <div class="stats">
        <div>Users<span id="statUsers">0</span></div>
        <div>Admins<span id="statAdmins">0</span></div>
        <div>Suspended<span id="statSuspended">0</span></div>
      </div>
    </header>

    <nav style="margin:-14px 0 20px; text-align:right;">
      <a href="inventory.html">Inventory</a>
      <a href="admin-login.html">Log out</a>
    </nav>

    <div class="panel">
      <form id="addForm">
        <div>
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="e.g. Jane Doe">
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="jane@example.com">
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>
        <div>
          <label for="role">Role</label>
          <select id="role">
            <option value="Staff">Staff</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn-add">Add user</button>
      </form>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none;">No users yet — add your first user above.</div>
    </div>

    <footer>Data is stored in the database via the backend API.</footer>
  </div>

  <script src="admin.js">
  </script>
</body>

</html>
