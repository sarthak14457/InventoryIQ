<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Stock Ledger — Admin Log In</title>
  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <div class="card">
    <div class="brand">
      <h1>Stock Ledger</h1>
      <div class="sub">Admin log in</div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="error" id="errorMsg">Admin access only.</div>
      <button type="submit">Log in</button>
      <div class="success" id="successMsg">Logged in — redirecting to admin...</div>
    </form>
  </div>

  <script src="admin-login.js">
  
  </script>

</body>

</html>
